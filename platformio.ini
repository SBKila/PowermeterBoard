; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 74880
board_build.filesystem = littlefs
monitor_filters = esp8266_exception_decoder, time, colorize
;build_type = debug
; ib_compat_mode = strict
; lib_ldf_mode = chain
lib_deps = 
	esp32async/ESPAsyncTCP@2.0.0
	esp32async/ESPAsyncWebServer@^3.10
	bblanchon/ArduinoJson@^7.4
	sbkila/HomeAssistantLibrary@^0.2
	akajes/AsyncPing(esp8266)@^1.1.0
extra_scripts = post:post_build_versioninc.py
lib_ignore = AsyncTCP
build_flags = 
	-D BUILD_MAJOR_RELEASE=0
	-D BUILD_MINOR_RELEASE=2
	-D EEPROMMAGIC=140
	-D ON_DEV
	-include "./src/myDebugLogger.h"
	; -D ENABLE_DEBUG
	; -D MONITOR_SPEED=${this.monitor_speed}
	; -D MY_DEBUG_ESP_PORT=Serial
	; -D DEBUG_MAIN
	; -D DEBUG_WIFIMGR
	; -D DEBUG_PWBOARD
	; -D DEBUG_HALIB_DEVICE
	-D ENABLE_DEBUG_WEB
	-D "TEMPLATE_PLACEHOLDER=(char)96"
	-D ASYNCWEBSERVER_REGEX
    -D LT_ARD_HAS_WIFI ;Force ESPAsyncWebServer to managed ON_STA_FILTER and ON_AP_FILTER
	-fexceptions
