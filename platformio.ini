[platformio]
# Default environment to prevent accidental OTA triggers
default_envs = nodemcuv2_usb 

; --- COMMON CONFIGURATION (Inherited by all environments) ---
[env_common]
platform = espressif8266
board = nodemcuv2
framework = arduino

# Use LittleFS for modern flash wear-leveling and performance
board_build.filesystem = littlefs

# CRITICAL: Define a fixed Flash Layout (4MB total: 1MB for FS, 2MB for OTA update slot)
# This prevents "End Failed" errors caused by partition size mismatches.
board_build.ldscript = eagle.flash.4m1m.ld 

# Monitor settings for debugging
monitor_speed = 74880
monitor_filters = esp8266_exception_decoder, time, colorize

# Dependency Management
lib_ldf_mode = chain
lib_deps = 
    esp32async/ESPAsyncTCP@2.0.0
    esp32async/ESPAsyncWebServer@^3.10
    bblanchon/ArduinoJson@^7.4
    sbkila/HomeAssistantLibrary@^0.2
    akajes/AsyncPing(esp8266)@^1.1.0

# Prevent conflicts with ESP32 specific libraries
lib_ignore = AsyncTCP

# Custom post-build script for versioning
extra_scripts = post:post_build_versioninc.py

# Preprocessor definitions
build_flags = 
    -D BUILD_MAJOR_RELEASE=0
    -D BUILD_MINOR_RELEASE=2
    -D EEPROMMAGIC=140
    -D ON_DEV
    -include "./src/myDebugLogger.h"
    ; -D ENABLE_DEBUG
    ; -D MONITOR_SPEED=${env_common.monitor_speed}
    ; -D MY_DEBUG_ESP_PORT=Serial
    ; -D DEBUG_MAIN
    -D ENABLE_DEBUG_WEB
    -D "TEMPLATE_PLACEHOLDER=(char)96"
    -D ASYNCWEBSERVER_REGEX
    -D LT_ARD_HAS_WIFI
    -fexceptions

; --- USB WIRED DEPLOYMENT ---
[env:nodemcuv2_usb]
extends = env_common
upload_protocol = esptool
# upload_port is auto-detected by esptool

; --- OTA WIRELESS DEPLOYMENT ---
[env:nodemcuv2_ota]
extends = env_common
upload_protocol = espota
upload_port = dev-powermetersboard.local
upload_flags = 
    # Ensure the ESP knows which IP on your PC is sending the data
    #--host_ip=192.168.0.87